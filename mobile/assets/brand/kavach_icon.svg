<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
  <!-- App icon: the mark on an ink tile with a faint ultramarine aura. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161925"/>
      <stop offset="1" stop-color="#06070A"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#8C9BFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8C9BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#aura)"/>
  <g transform="translate(112 112) scale(0.78)">
    <image href="kavach_mark.svg" width="1024" height="1024"/>
  </g>
</svg>
