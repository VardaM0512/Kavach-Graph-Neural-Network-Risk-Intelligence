name: kavach
description: Kavach — Corporate Financial Risk Intelligence (Flutter mobile app).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # networking + state
  dio: ^5.4.0
  provider: ^6.1.1
  flutter_secure_storage: ^9.0.0

  # charts + graph visualisation
  fl_chart: ^0.66.0
  graphview: ^1.2.0

  # voice / audio (multilingual)
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true            # build localizations from lib/l10n/*.arb
  assets:
    - assets/
