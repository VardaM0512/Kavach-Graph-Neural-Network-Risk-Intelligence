name: kavach
description: Kavach — Corporate Financial Risk Intelligence web app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3

  # networking + state
  dio: ^5.4.0
  provider: ^6.1.1
  # charts + graph visualisation
  fl_chart: ^1.2.0
  # voice / audio (multilingual)
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5

  cupertino_icons: ^2.0.0
  supabase_flutter: ^2.18.3
  google_fonts: ^6.3.3
  shared_preferences: ^2.5.6
  flutter_svg: ^2.3.0
  file_picker: ^13.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/brand/

# App icons: `dart run flutter_launcher_icons` regenerates every size from the brand PNGs
# (render them first with `python scripts/render_brand.py`).
flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/brand/icon_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0B0D"
  adaptive_icon_foreground: "assets/brand/foreground_1024.png"
  adaptive_icon_monochrome: "assets/brand/monochrome_1024.png"
  ios: false
  web:
    generate: true
    image_path: "assets/brand/icon_square_1024.png"
    background_color: "#0A0B0D"
    theme_color: "#0A0B0D"
