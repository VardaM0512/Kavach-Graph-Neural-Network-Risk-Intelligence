version: "3.9"

# Full local stack: Postgres (financials) + Neo4j (relationships) + API.
# The API also runs standalone on the synthetic engine if you skip the DBs.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kavach
      POSTGRES_PASSWORD: kavach
      POSTGRES_DB: kavach
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kavach"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/kavachpass
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4jdata:/data
      - ./infra/neo4j/init.cypher:/init.cypher:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    environment:
      KAVACH_ENVIRONMENT: docker
      KAVACH_JWT_SECRET: docker-dev-secret-change-me
      KAVACH_POSTGRES_URL: postgresql+asyncpg://kavach:kavach@postgres:5432/kavach
      KAVACH_NEO4J_URI: bolt://neo4j:7687
      KAVACH_NEO4J_USER: neo4j
      KAVACH_NEO4J_PASSWORD: kavachpass
      KAVACH_WARM_ENGINE: "1"
    ports: ["8000:8000"]

volumes:
  pgdata:
  neo4jdata:
