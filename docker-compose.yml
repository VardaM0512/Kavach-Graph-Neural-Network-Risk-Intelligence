version: "3.9"

# The API is stateless: user data lives in Supabase (see supabase/schema.sql) and
# is sent with each request. Trained models are cached in a volume so restarts
# load them instead of retraining.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      KAVACH_ENVIRONMENT: docker
      KAVACH_JWT_SECRET: docker-dev-secret-change-me
      KAVACH_WARM_ENGINE: "1"
    ports: ["8000:8000"]
    volumes:
      - models:/app/ml/artifacts

volumes:
  models:
