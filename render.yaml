# One-click Kavach web + API deploy on Render (https://render.com).
# The API is stateless; accounts and user data live in Supabase.
services:
  - type: web
    name: kavach-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: KAVACH_ENVIRONMENT
        value: production
      - key: KAVACH_JWT_SECRET
        generateValue: true
      - key: KAVACH_WARM_ENGINE
        value: "0"   # lazy-load the model; keeps the free 512 MB instance healthy
