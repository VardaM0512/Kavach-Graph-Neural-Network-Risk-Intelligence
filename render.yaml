# One-click backend deploy on Render (https://render.com).
# The API is stateless; accounts and user data live in Supabase.
services:
  - type: web
    name: kavach-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: KAVACH_ENVIRONMENT
        value: production
      - key: KAVACH_JWT_SECRET
        generateValue: true
      - key: KAVACH_WARM_ENGINE
        value: "1"
